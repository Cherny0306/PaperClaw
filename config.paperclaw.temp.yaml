experiment:
  colab_drive:
    drive_root: ''
    poll_interval_sec: 30
    setup_script: ''
    timeout_sec: 3600
  docker:
    auto_install_deps: true
    gpu_enabled: false
    image: paperclaw/sandbox:latest
    keep_containers: false
    memory_limit_mb: 8192
    network_policy: setup_only
    shm_size_mb: 2048
  figure_agent:
    docker_image: paperclaw/experiment:latest
    dpi: 300
    enabled: true
    gemini_model: gemini-2.5-flash-image
    max_figures: 10
    max_iterations: 3
    min_figures: 3
    nano_banana_enabled: true
    output_format: python
    render_timeout_sec: 30
    strict_mode: false
  max_iterations: 10
  metric_direction: minimize
  metric_key: primary_metric
  mode: docker
  opencode:
    auto: true
    complexity_threshold: 0.2
    enabled: true
    max_retries: 1
    model: ''
    timeout_sec: 600
    workspace_cleanup: true
  sandbox:
    gpu_required: false
    max_memory_mb: 4096
    python_path: .venv/bin/python3
  ssh_remote:
    docker_image: paperclaw/experiment:latest
    docker_memory_limit_mb: 8192
    docker_network_policy: none
    docker_shm_size_mb: 2048
    gpu_ids: []
    host: ''
    key_path: ''
    port: 22
    remote_python: python3
    remote_workdir: /tmp/paperclaw_experiments
    setup_commands: []
    use_docker: false
    user: ''
  time_budget_sec: 300
export:
  authors: Anonymous
  bib_file: references
  target_conference: neurips_2025
knowledge_base:
  backend: markdown
  root: docs/kb
llm:
  api_key: dc0d0bde5afe4427abe5f3c27958d8b3.rEZ1g29mjFIg6Jq9
  api_key_env: DEEPSEEK_API_KEY
  base_url: https://open.bigmodel.cn/api/paas/v4
  fallback_models:
  - glm-4-flash
  - glm-4-air
  primary_model: glm-4-plus
  provider: openai-compatible
  s2_api_key: ''
metaclaw_bridge:
  enabled: false
  fallback_api_key: ''
  fallback_url: ''
  lesson_to_skill:
    enabled: true
    max_skills_per_run: 3
    min_severity: warning
  prm:
    api_base: ''
    api_key: ''
    api_key_env: PRM_API_KEY
    enabled: false
    gate_stages:
    - 5
    - 9
    - 15
    - 20
    model: gpt-4o
    votes: 3
  proxy_url: http://localhost:30000
  skills_dir: ~/.metaclaw/skills
notifications:
  channel: console
  on_gate_required: true
  on_stage_fail: true
  on_stage_start: true
  target: ''
openclaw_bridge:
  use_browser: false
  use_cron: false
  use_memory: false
  use_message: false
  use_sessions_spawn: false
  use_web_fetch: false
project:
  mode: full-auto
  name: my-research
prompts:
  custom_file: ''
research:
  daily_paper_count: 10
  domains:
  - machine-learning
  - nlp
  quality_threshold: 4.0
  topic: 你的研究主题
runtime:
  approval_timeout_hours: 12
  max_parallel_tasks: 3
  retry_limit: 2
  timezone: Asia/Shanghai
security:
  allow_publish_without_approval: false
  hitl_required_stages:
  - 5
  - 9
  - 20
  redact_sensitive_logs: true
